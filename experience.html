<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Me | Nur Farah Husna</title>

  <style>
    /* ---------- Global Styles ---------- */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #4a4a4a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;

      background-image: url("images/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* ---------- Header ---------- */
    header {
      height: 180px;
      background-image: url("images/header.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(255, 228, 233, 0.6);
    }

    header h1 {
      position: relative;
      margin: 0;
      font-size: 2.3rem;
      color: #4b4b4b;
      z-index: 1;
    }

    /* ---------- Navbar ---------- */
    nav {
      width: 100%;
      background-color: #4b4b4b;
      padding: 14px 0;
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 15px;
      padding: 0;
      margin: 0;
      flex-wrap: wrap;
    }

    nav ul li a {
      text-decoration: none;
      background-color: #F3A6B5;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 18px;
      border-radius: 25px;
      transition: 0.3s ease;
    }

    nav ul li a:hover {
      background-color: #E58FA1;
      transform: translateY(-2px);
    }

    /* ---------- Main ---------- */
    main {
      flex: 1;
      max-width: 900px;
      margin: 35px auto;
      background: #ffffff;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.07);
      text-align: center;
    }

    /* ---------- Profile Images ---------- */
    .about-images {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .about-images img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    /* ---------- About Me Content ---------- */
    .about-content {
      max-width: 650px;
      margin: auto;
      text-align: left;
      font-size: 1rem;
      line-height: 1.7;
    }

    .about-content p {
      margin: 10px 0;
    }

    .about-content span {
      font-weight: 600;
      color: #4b4b4b;
    }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      background: #F6C1CC;
      color: #ffffff;
      padding: 10px 0;
      font-size: 0.85rem;
    }
  </style>
</head>
